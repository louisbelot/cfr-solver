name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: test-${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune test
      - name: smoke test the CLI
        if: runner.os == 'Linux'
        run: |
          opam exec -- dune exec cfr-solver -- solve -n 10000 --json kuhn.json --trace trace.csv
          opam exec -- dune exec cfr-solver -- solve -g leduc -a cfr+ -n 1000 --json leduc.json
          opam exec -- dune exec cfr-solver -- solve -g leduc -a es -n 20000 --seed 3 --json es.json
          opam exec -- dune exec cfr-solver -- solve -a os -n 20000 --trace os.csv
          opam exec -- dune exec cfr-solver -- compare -g leduc -n 1000 --csv compare.csv --svg compare.svg
          opam exec -- dune exec cfr-solver -- solve -g leduc -a es -n 200000 --domains 4
          opam exec -- dune exec cfr-solver -- solve -g leduc -a os -n 200000 --domains 4 --private -w lcfr --batch 100
          opam exec -- dune exec cfr-solver -- scale -g leduc -n 200000 --domains 1,2,4 --csv scale.csv --svg scale.svg
          opam exec -- dune exec cfr-solver -- abstract --ranks 5 -n 200 --domains 2 --csv abs.csv --svg abs.svg
          opam exec -- dune exec cfr-solver -- subgame --board "Qs Jh 8d 5c 2s" --pot 6 --limit 1 -a cfr,cfr+,lcfr,dcfr -n 200 --csv river.csv --svg river.svg --json river.json
          opam exec -- dune exec cfr-solver -- subgame --board "Qs Jh 8d 5c" --oop "TT+, AQ+, KQs" --ip "88+, AJ+, KQ, QJs" --pot 4 --limit 1 -n 20
          opam exec -- dune exec cfr-solver -- translate --board "Qs Jh 8d 5c 2s" -n 200 --grid 0.25,2,0.25 --csv tr.csv --svg tr.svg
          opam exec -- dune exec cfr-solver -- betsizes --board "Qs Jh 8d 5c 2s" -n 100 --set 1 --set 0.5,1
          opam exec -- dune exec ./bench/bench.exe

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - run: opam install ocamlformat.0.29.0
      - run: opam exec -- dune build @fmt
