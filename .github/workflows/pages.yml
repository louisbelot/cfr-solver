name: pages

on:
  push:
    branches: [main]
    paths: ["lib/**", "web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - run: opam install . --deps-only
      - run: opam install js_of_ocaml-compiler js_of_ocaml
      - run: opam exec -- dune build --profile release ./web/worker.bc.js
      - run: node web/smoke.js _build/default/web/worker.bc.js
      - run: |
          mkdir _site
          cp web/index.html web/style.css web/app.js _build/default/web/worker.bc.js _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
